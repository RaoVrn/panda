<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/panda.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Resolve theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem("panda-theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var theme = stored || (prefersDark ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
    <meta
      name="description"
      content="Panda is the most beautiful, interactive and beginner-friendly way to learn Git, GitHub and Version Control."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Panda" />
    <meta property="og:title" content="Panda · Git, made visual" />
    <meta
      property="og:description"
      content="Learn Git, GitHub and version control with an interactive playground, a visual simulator and a built-in AI mentor."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Panda · Git, made visual" />
    <meta
      name="twitter:description"
      content="Learn Git, GitHub and version control with an interactive playground, a visual simulator and a built-in AI mentor."
    />
    <title>Panda · Git, made visual</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
